name: Update Görevli Bilgilendirme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update notice styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_h2 = '<h2>📌 Görevli Bilgilendirme</h2>'
          new_h2 = '<h2 style="color: #6b3f1d; font-weight: 800;">📌 Görevli Bilgilendirme</h2>'
          old_p = '<p class="intro-text">Değerli Komisyon Üyeleri, MEBBİS üzerinden görevli kartınızı almayı unutmayınız.</p>'
          new_p = '<p class="intro-text" style="color: #6b3f1d; font-weight: 700;">Değerli Komisyon Üyeleri, MEBBİS üzerinden görevli kartınızı almayı unutmayınız.</p>'
          if old_h2 not in s or old_p not in s:
              raise SystemExit('Beklenen Görevli Bilgilendirme metni bulunamadı.')
          s = s.replace(old_h2, new_h2, 1).replace(old_p, new_p, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-gorevli-bilgilendirme.yml
          git commit -m "Görevli bilgilendirme metnini koyu kahverengi yap"
          git push
